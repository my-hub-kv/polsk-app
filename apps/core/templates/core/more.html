{% extends 'core/base.html' %}

{% block content %}
  <section class="more-page" aria-labelledby="page-title">
    <div class="page-heading">
      <p class="eyebrow">Polsk App</p>
      <h1 id="page-title">Mere</h1>
      <p>Find deltageroversigten, dine notifikationer og andre dele af Polsk App.</p>
    </div>
    <div class="more-grid">
      {% for item in more_items %}
        <a class="more-card" href="{{ item.url }}">
          <span>
            <strong>{{ item.title }}</strong>
            <small>{{ item.description }}</small>
          </span>
          <span aria-hidden="true">→</span>
        </a>
      {% endfor %}
    </div>
  </section>
{% endblock %}
