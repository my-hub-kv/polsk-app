name: Bug report
description: Report incorrect behaviour safely
title: "Bug: "
labels: [bug]
body:
  - type: markdown
    attributes: {value: "Remove secrets and personal data from logs; redact screenshots."}
  - type: textarea
    id: summary
    attributes: {label: Summary}
    validations: {required: true}
  - type: textarea
    id: reproduction
    attributes: {label: Reproduction}
    validations: {required: true}
  - type: textarea
    id: expected
    attributes: {label: Expected result}
    validations: {required: true}
  - type: textarea
    id: actual
    attributes: {label: Actual result}
    validations: {required: true}
  - type: input
    id: role
    attributes: {label: Affected role}
  - type: input
    id: event_year
    attributes: {label: Affected event year}
  - type: textarea
    id: security
    attributes: {label: Security or privacy concern}
  - type: textarea
    id: evidence
    attributes: {label: Sanitised logs and redacted screenshots}
  - type: input
    id: environment
    attributes: {label: Environment category, without account details}
