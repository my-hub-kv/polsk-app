name: Production database keepalive

on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keepalive:
    name: Verify production database connection
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      KEEPALIVE_SECRET: ${{ secrets.KEEPALIVE_SECRET }}

    steps:
      - name: Request the protected database keepalive endpoint
        run: |
          test -n "$KEEPALIVE_SECRET"
          curl --fail --show-error --silent \
            --retry 3 \
            --retry-delay 10 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 180 \
            --request POST \
            --header "Authorization: Bearer $KEEPALIVE_SECRET" \
            --header "Cache-Control: no-store" \
            https://polsk-app.onrender.com/internal/database-keepalive/
