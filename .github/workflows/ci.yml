name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  django:
    name: Django checks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: polsk_app
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: ci-only-secret
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGDATABASE: polsk_app
      PGUSER: postgres
      PGPASSWORD: postgres
      PGSSLMODE: disable
      PGCHANNELBINDING: disable

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Build frontend assets
        run: |
          npm ci
          npm run build:css

      - name: Test Starti integration bridge
        run: npm run test:startiapp

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check installed dependencies
        run: python -m pip check

      - name: Compile Python code
        run: python -m compileall -q config apps

      - name: Apply migrations
        run: python manage.py migrate --noinput

      - name: Check Django configuration
        run: python manage.py check

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Collect static files
        run: python manage.py collectstatic --noinput

      - name: Run tests
        # Django's test client uses HTTP unless a test explicitly requests HTTPS.
        # Production settings are checked above; test mode keeps view assertions
        # focused on their intended behaviour rather than the HTTPS redirect.
        env:
          DJANGO_DEBUG: "True"
        run: python manage.py test

  migrate-production:
    name: Production migrations
    needs: django
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
    permissions:
      contents: read
    env:
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: ${{ secrets.MIGRATION_DJANGO_SECRET_KEY }}
      PGHOST: ${{ secrets.MIGRATION_PGHOST }}
      PGPORT: "5432"
      PGDATABASE: ${{ secrets.MIGRATION_PGDATABASE }}
      PGUSER: ${{ secrets.MIGRATION_PGUSER }}
      PGPASSWORD: ${{ secrets.MIGRATION_PGPASSWORD }}
      PGSSLMODE: require
      PGCHANNELBINDING: require
      POLSK_DATABASE_CONNECTION_MODE: direct

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Show migration plan
        run: python manage.py migrate --plan

      - name: Apply migrations
        run: python manage.py migrate --noinput
