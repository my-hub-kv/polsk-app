name: Keep web service awake

on:
  schedule:
    # Runs at 7, 17, 27, 37, 47, and 57 minutes past every hour.
    # Avoids scheduling at the busiest start of the hour.
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-web-service-awake
  cancel-in-progress: true

jobs:
  ping:
    name: Request health endpoint
    runs-on: ubuntu-latest
    timeout-minutes: 4

    env:
      APP_BASE_URL: ${{ vars.APP_BASE_URL }}

    steps:
      - name: Check application health
        run: |
          test -n "$APP_BASE_URL"

          curl \
            --fail \
            --show-error \
            --silent \
            --output /dev/null \
            --retry 2 \
            --retry-delay 40 \
            --retry-all-errors \
            --connect-timeout 60 \
            --max-time 250 \
            --header "Cache-Control: no-store" \
            "${APP_BASE_URL%/}/health/"
