services:
  - type: web
    name: polsk-app
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    buildCommand: bash build.sh
    startCommand: >-
      python -m gunicorn config.wsgi:application
      --bind 0.0.0.0:$PORT
      --workers 1
      --threads 4
      --timeout 120
    healthCheckPath: /health/
    autoDeployTrigger: checksPass
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
