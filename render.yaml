services:
  - type: web
    name: polsk-app
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    buildCommand: bash build.sh
    preDeployCommand: POLSK_DATABASE_CONNECTION_MODE=direct python manage.py migrate --noinput
    startCommand: >-
      python -m gunicorn config.wsgi:application
      --bind 0.0.0.0:$PORT
      --workers 1
      --threads 4
      --timeout 120
    healthCheckPath: /health/
    autoDeployTrigger: checksPass
    envVars:
      - fromGroup: polsk-app-runtime
      - key: KEEPALIVE_SECRET
        sync: false
  - type: cron
    name: polsk-app-notification-delivery
    runtime: python
    plan: starter
    region: frankfurt
    branch: main
    schedule: "*/5 * * * *"
    buildCommand: bash build.sh
    startCommand: >-
      python manage.py deliver_notifications &&
      python manage.py cleanup_throttle_state
    envVars:
      - fromGroup: polsk-app-runtime
